name: Проверка Windows
on:
  push:
    branches: [main]
    paths-ignore: ['mobile/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths-ignore: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npx --yes pnpm@10.34.5 install --frozen-lockfile
      - run: npx --yes pnpm@10.34.5 check:repo
      - run: npx --yes pnpm@10.34.5 typecheck
      - run: npx --yes pnpm@10.34.5 lint
      # Случайный порядок ловит тесты, зависящие от соседей; упавший порядок повторяется тем же --sequence.seed
      - run: |
          $seed = Get-Random -Minimum 1 -Maximum 2147483647
          Write-Output "Зерно порядка тестов: $seed"
          npx --yes pnpm@10.34.5 exec vitest run --sequence.shuffle --sequence.seed=$seed
      - run: npx --yes pnpm@10.34.5 test:electron
      - run: npx --yes pnpm@10.34.5 build-win
        env:
          SKIP_VMP_SIGNING: 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-test-without-vmp
          path: build/*setup-x64.exe
          retention-days: 7
